<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Jericho — a Python framework for LLM assistants</title>
  <desc id="desc">Build assistants with controlled tool execution. A diagram shows a proposed tool call passing through a risk policy and confirmation before an action and audit log.</desc>
  <rect width="1280" height="640" fill="#f4f2e9"/>
  <rect x="1" y="1" width="1278" height="638" rx="2" fill="none" stroke="#d5d9cc" stroke-width="2"/>
  <g font-family="Google Sans Flex, sans-serif" fill="#173e31">
    <text x="64" y="156" font-size="108" font-weight="700">Jericho</text>
    <text x="68" y="217" font-size="27">A Python framework for LLM assistants</text>
    <text x="64" y="320" font-size="49" font-weight="600">Build assistants.</text>
    <text x="64" y="380" font-size="49" font-weight="600">Control their actions.</text>
    <text x="68" y="454" font-size="24" fill="#416351">Risk policies · Confirmations · Audit logs</text>
    <path d="M68 514H1212" stroke="#cbd2c4" stroke-width="1.5"/>
    <text x="68" y="566" font-size="22">github.com/Anach0ret/jericho-ai</text>
    <text x="1212" y="566" text-anchor="end" font-size="21" fill="#416351">Open source · Apache 2.0</text>
  </g>
  <g font-family="Google Sans Flex, sans-serif" fill="#173e31">
    <!-- Filled geometry: no SVG stroke/marker dependency in the PNG renderer. -->
    <rect x="914" y="164" width="4" height="39" fill="#235744"/>
    <polygon points="906,201 926,201 916,214" fill="#235744"/>
    <rect x="914" y="324" width="4" height="41" fill="#235744"/>
    <polygon points="906,363 926,363 916,376" fill="#235744"/>
    <rect x="754" y="104" width="324" height="59" rx="9" fill="#e6eadf"/>
    <text x="916" y="141" text-anchor="middle" font-size="23">Proposed tool call</text>
    <rect x="754" y="217" width="324" height="106" rx="9" fill="#173e31"/>
    <text x="916" y="259" text-anchor="middle" font-size="29" font-weight="600" fill="#f4f2e9">Risk policy</text>
    <text x="916" y="294" text-anchor="middle" font-size="20" fill="#d7e3d5">Confirm when required</text>
    <rect x="754" y="379" width="324" height="59" rx="9" fill="#e6eadf"/>
    <text x="916" y="416" text-anchor="middle" font-size="23">Action + audit log</text>
    <rect x="1078" y="268" width="65" height="4" fill="#235744"/>
    <polygon points="1141,260 1155,270 1141,280" fill="#235744"/>
    <text x="1120" y="247" text-anchor="middle" font-size="16" fill="#416351">or</text>
    <text x="1168" y="278" font-size="19">Refuse</text>
  </g>
</svg>
